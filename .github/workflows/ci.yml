name: ci
on:
  push:
    branches: [main, LEGACY]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nx-core:
    name: NX core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-22.04, python: "3.12" }
          - { os: windows-2022, python: "3.8" }
          - { os: windows-2022, python: "3.12" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - name: Python unit tests (NX core)
        working-directory: extensions/nx-studio/python
        run: node ../../../nx/ci-run.mjs "NX Python tests" -- python -m unittest discover -s tests -v
      - name: CI helper test
        run: node nx/test-ci-run.mjs
      - name: Extension smoke test (real core, fake vscode API)
        run: node nx/ci-run.mjs "extension smoke test" -- node extensions/nx-studio/test/smoke.js
  ci-doctor:
    name: CI Doctor on our own workflows
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Lint workflows (fail on errors only)
        working-directory: extensions/nx-studio/python
        run: |
          python - <<'PY'
          import glob, sys
          from nxcs import cilint
          bad = 0
          for f in sorted(glob.glob("../../../.github/workflows/*.yml")):
              for x in cilint.lint(f):
                  print("%s:%s [%s] %s" % (f, x["line"], x["severity"], x["msg"]))
                  bad += x["severity"] == "error"
          sys.exit(1 if bad else 0)
          PY
