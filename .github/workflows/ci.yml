name: ci
on:
  push:
    branches: [main, LEGACY]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nx-core:
    name: NX core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-22.04, python: "3.12" }
          - { os: windows-2022, python: "3.8" }
          - { os: windows-2022, python: "3.12" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Python unit tests (NX core)
        working-directory: extensions/nx-studio/python
        run: python -m unittest discover -s tests -v
      - name: Extension smoke test (real core, fake vscode API)
        run: node extensions/nx-studio/test/smoke.js
  ci-doctor:
    name: CI Doctor on our own workflows
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Lint workflows (fail on errors only)
        working-directory: extensions/nx-studio/python
        run: |
          python - <<'PY'
          import glob, sys
          from nxcs import cilint
          bad = 0
          for f in sorted(glob.glob("../../../.github/workflows/*.yml")):
              for x in cilint.lint(f):
                  print("%s:%s [%s] %s" % (f, x["line"], x["severity"], x["msg"]))
                  bad += x["severity"] == "error"
          sys.exit(1 if bad else 0)
          PY
