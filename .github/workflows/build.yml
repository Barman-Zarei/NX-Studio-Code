name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    if: matrix.target != 'linux' || github.ref != 'refs/heads/LEGACY'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32
            arch: x64

          - os: ubuntu-22.04
            target: linux
            arch: x64

    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: build
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: build
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: build
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev

      - name: build
        run: |
          node nx/ci-run.mjs "build" -- npm ci

      - name: build
        run: |
          node nx/ci-run.mjs "build" -- npm run gulp vscode-${{ matrix.target }}-${{ matrix.arch }}-min

      - name: build
        if: matrix.target == 'win32'
        run: |
          node nx/ci-run.mjs "build" -- npm run gulp vscode-win32-${{ matrix.arch }}-inno-updater
          node nx/ci-run.mjs "build" -- npm run gulp vscode-win32-${{ matrix.arch }}-archive
          node nx/ci-run.mjs "build" -- npm run gulp vscode-win32-${{ matrix.arch }}-user-setup

      - name: build
        if: matrix.target == 'linux'
        run: |
          tar -czf NX-Studio-Code-linux-${{ matrix.arch }}.tar.gz \
            -C .. VSCode-linux-${{ matrix.arch }}

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx-studio-code-${{ github.ref_name }}-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            .build/win32-${{ matrix.arch }}/archive/*.zip
            .build/win32-${{ matrix.arch }}/user-setup/*.exe
            NX-Studio-Code-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: build
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/win32-${{ matrix.arch }}/archive/*.zip
            .build/win32-${{ matrix.arch }}/user-setup/*.exe
            NX-Studio-Code-linux-${{ matrix.arch }}.tar.gz
